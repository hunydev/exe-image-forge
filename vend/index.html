<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>huny images</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--fg:#e6edf3;--mut:#8b949e;--card:#161b22;--line:#30363d;--acc:#2f81f7;--ok:#3fb950}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:760px}
h1{font-size:22px;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 20px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
input,select{width:100%;background:#0d1117;border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:10px 12px;font:inherit}
input:focus,select:focus{outline:none;border-color:var(--acc)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:150px}
button{margin-top:16px;width:100%;background:var(--acc);border:0;border-radius:8px;color:#fff;font:600 15px/1 inherit;padding:12px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
pre{background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0}
.f{margin-bottom:14px}
.f .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cp{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:3px 9px;font-size:11px;cursor:pointer;width:auto;margin:0}
.cp:hover{color:var(--fg);border-color:var(--acc)}
.err{color:#f85149;font-size:13px;margin-top:12px}
.exp{color:var(--ok);font-size:13px;font-weight:600}
.hide{display:none !important}
.banner{border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13.5px}
.banner b{display:block;margin-bottom:3px}
.b-warn{background:rgba(210,153,34,.12);border:1px solid rgba(210,153,34,.4)}
.b-bad{background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.4)}
.banner a{color:var(--acc);font-weight:600}
.topbar{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.topbar .sp{flex:1}
.topbar a{color:var(--mut);font-size:13px;text-decoration:none}
.topbar a:hover{color:var(--acc)}
.pkbtn{margin-top:0;background:transparent;border:1px solid var(--acc);color:var(--acc)}
.pkbtn:hover{background:var(--acc);color:#fff}
.sepwrap{display:flex;align-items:center;gap:10px;margin:16px 0 4px;color:var(--mut);font-size:12px}
.sepwrap::before,.sepwrap::after{content:"";flex:1;height:1px;background:var(--line)}
.pkok{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:13px;
  background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.35);color:#7ee787}
kbd{background:#21262d;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><h1>huny images</h1><span class="sp"></span><a href="/admin/">관리 페이지 →</a></div>
  <p class="sub">비밀번호를 입력하면 지정 시간 동안만 유효한 이미지 경로가 발급됩니다.</p>

  <div id="banners"></div>

  <div class="card" id="login">
    <div id="pkbox" class="hide">
      <button id="pklogin" class="pkbtn">🔑 패스키로 로그인</button>
      <div class="pkok hide" id="pkok">패스키로 인증됨 — 암호 없이 발급할 수 있습니다</div>
      <div class="sepwrap"><span>또는 암호 사용</span></div>
    </div>
    <div class="f" id="pwbox">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus>
    </div>
    <div class="row">
      <div><label for="repo">Image</label><select id="repo"></select></div>
      <div><label for="ttl">TTL (분)</label><input id="ttl" type="number" min="1" max="1440" value="30"></div>
    </div>
    <button id="go">이미지 경로 발급</button>
    <div class="err hide" id="err"></div>
  </div>

  <div class="card hide" id="out">
    <div class="f"><div class="hd"><label>만료</label><span class="exp" id="exp"></span></div></div>
    <div class="f"><div class="hd"><label>exe.dev 로 VM 생성</label><button class="cp" data-c="exe">copy</button></div><pre id="exe"></pre></div>
    <div class="f"><div class="hd"><label>docker pull</label><button class="cp" data-c="dk">copy</button></div><pre id="dk"></pre></div>
    <div class="f"><div class="hd"><label>image ref</label><button class="cp" data-c="raw">copy</button></div><pre id="raw"></pre></div>
    <p class="sub" style="margin:0">만료 후 태그와 토큰 경로가 모두 삭제됩니다. 다시 필요하면 <kbd>재발급</kbd>하세요.</p>
  </div>
</div>
<script src="/passkey.js"></script>
<script>
const $=s=>document.querySelector(s);
fetch('/api/info').then(r=>r.json()).then(d=>{
  $('#repo').innerHTML=d.repos.map(r=>`<option>${r}</option>`).join('');
  if(d.ttl_minutes)$('#ttl').value=d.ttl_minutes;
}).catch(()=>{});

// Warn about credential problems before an image path is handed out, so a
// stale image is not shipped to a fresh VM unnoticed.
fetch('/api/creds').then(r=>r.json()).then(d=>{
  if(d.authed){pkShowAuthed();$('#pkbox').classList.remove('hide')}
  else if(d.passkeys>0&&pkSupported()){$('#pkbox').classList.remove('hide')}
  const w=d.warnings||[]; if(!w.length)return;
  const c=d.counts||{}, severe=(c.missing||0)+(c.expired||0)+(c.unknown||0);
  $('#banners').innerHTML=`<div class="banner ${severe?'b-bad':'b-warn'}">
    <b>${severe?'구워진 이미지의 자격증명에 문제가 있습니다':'참고'}</b>
    ${w.map(x=>`<div>${x}</div>`).join('')}
    ${severe?'<div style="margin-top:8px"><a href="/admin/">관리 페이지에서 로그인하고 다시 bake →</a></div>':''}
  </div>`;
}).catch(()=>{});
async function grant(){
  const b=$('#go');b.disabled=true;b.textContent='발급 중...';$('#err').classList.add('hide');
  try{
    const r=await fetch('/api/grant',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({password:$('#pw').value,repo:$('#repo').value,ttl:+$('#ttl').value})});
    if(!r.ok)throw new Error(await r.text());
    const d=await r.json();
    $('#exe').textContent=d.exe_cmd;
    $('#dk').textContent=d.docker_cmd;
    $('#raw').textContent=d.image;
    $('#exp').textContent=new Date(d.expires).toLocaleString()+`  (${d.ttl_minutes}분)`;
    $('#out').classList.remove('hide');
    b.textContent='재발급';
  }catch(e){
    $('#err').textContent=String(e.message||e).trim();$('#err').classList.remove('hide');
    b.textContent='이미지 경로 발급';
  }finally{b.disabled=false}
}
$('#go').onclick=grant;
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')grant()});

// ---- passkey ----
// A passkey session authorises /api/grant on its own, so once authenticated the
// password field is no longer needed and is hidden to make that obvious.
let pkAuthed=false;
function pkShowAuthed(){
  pkAuthed=true;
  $('#pkok').classList.remove('hide');
  $('#pklogin').classList.add('hide');
  $('#pwbox').classList.add('hide');
  $('#pkbox').querySelector('.sepwrap').classList.add('hide');
}
async function pkDoLogin(){
  const b=$('#pklogin'); b.disabled=true; $('#err').classList.add('hide');
  try{ await pkLoginCeremony(); pkShowAuthed() }
  catch(e){ $('#err').textContent=pkError(e); $('#err').classList.remove('hide') }
  finally{ b.disabled=false }
}
$('#pklogin').onclick=pkDoLogin;
document.addEventListener('click',e=>{
  const t=e.target.closest('.cp');if(!t)return;
  navigator.clipboard.writeText($('#'+t.dataset.c).textContent).then(()=>{
    const o=t.textContent;t.textContent='copied';setTimeout(()=>t.textContent=o,1200)});
});
</script>
</body>
</html>
